###############################################################################
#
# dZSbot 2.0 configuration
#
###############################################################################

::dZSbot::Config::Set database.mysql.enabled 0
::dZSbot::Config::Set database.mysql.host "127.0.0.1"
::dZSbot::Config::Set database.mysql.port 3306
::dZSbot::Config::Set database.mysql.user "dzsbot"
::dZSbot::Config::Set database.mysql.password ""
::dZSbot::Config::Set database.mysql.database "dzsbot"
::dZSbot::Config::Set database.mysql.ssl.required 0
::dZSbot::Config::Set database.mysql.ssl.ca ""
::dZSbot::Config::Set database.mysql.ssl.cert ""
::dZSbot::Config::Set database.mysql.ssl.key ""
::dZSbot::Config::Set database.mysql.ssl.capath ""
::dZSbot::Config::Set database.mysql.ssl.cipher ""
::dZSbot::Config::Set database.mysql.extra_options {}

::dZSbot::Config::Set theme.name "default"

::dZSbot::Config::Set status.admin_channel "#staff"
::dZSbot::Config::Set status.require_channel_op 1
::dZSbot::Config::Set status.reply_target "private"

::dZSbot::Config::Set update_check.enabled 1
::dZSbot::Config::Set update_check.channel ""
::dZSbot::Config::Set update_check.interval_seconds 86400
::dZSbot::Config::Set update_check.timeout_ms 10000
::dZSbot::Config::Set update_check.endpoint "https://api.github.com/repos/Mainfr4m3/dZSbot/releases/latest"
::dZSbot::Config::Set update_check.cache_file [file join $::dZSbot::Root runtime update-check.tsv]

::dZSbot::Config::Set api.tls.verify 0

::dZSbot::Config::Set site.adapter "ioftpd"
::dZSbot::Config::Set site.host "127.0.0.1"
::dZSbot::Config::Set site.port 5420
::dZSbot::Config::Set site.user ""
::dZSbot::Config::Set site.password ""
::dZSbot::Config::Set site.ioftpd.config_path "C:/ioFTPD/system/ioFTPD.ini"
::dZSbot::Config::Set site.ioftpd.log_path "C:/ioFTPD/logs"
::dZSbot::Config::Set site.ioftpd.message_window "ioFTPD::MessageWindow"
::dZSbot::Config::Set site.ioftpd.nxpre_watch.enabled 1
::dZSbot::Config::Set site.ioftpd.nxpre_log_file "C:/ioFTPD/logs/ioFTPD.log"
::dZSbot::Config::Set site.ioftpd.nxpre_poll_seconds 5
::dZSbot::Config::Set site.ioftpd.nxpre_start_at_end 1
::dZSbot::Config::Set site.event_transport "local"
::dZSbot::Config::Set site.command_transport "ftps"
::dZSbot::Config::Set site.passive 1
::dZSbot::Config::Set site.passive_ports "5421-5450"
::dZSbot::Config::Set site.tls.required 1
::dZSbot::Config::Set site.tls.min_version "1.3"
::dZSbot::Config::Set site.allow_plain_event_source 1

set ::dZSbot::FluxFtpConfig [file join $::dZSbot::Root config adapters fluxftp.conf]
if {[file exists $::dZSbot::FluxFtpConfig]} {
    source $::dZSbot::FluxFtpConfig
}
unset -nocomplain ::dZSbot::FluxFtpConfig
